name: Email reminder check

# Vercel Hobbyプランのcron制約(1日1回まで)では未返信メールリマインド(1時間おきの判定が
# 必要)を組めないため、GitHub Actionsのscheduled workflowから
# /api/cron/email-reminder-check を叩く方式にする(vercel.jsonのcronsには登録しない)。
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# 前回実行が長引いて次のscheduled runと重なる多重起動を抑止する(保険的な対策、
# shirokuma-secレビューWARN対応、2026-08-16)。二重送信防止自体はsrc/email_reminders/db.py
# 側(EmailReminderLogのユニーク制約へのON CONFLICT DO NOTHING)で担保済みだが、そもそも
# 同時実行を避けられるならその方が安全なため、両輪で対策する。
concurrency:
  group: email-reminder-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call email-reminder-check endpoint
        run: |
          curl -f -sS \
            -H "Authorization: Bearer ${{ secrets.EMAIL_REMINDER_CRON_SECRET }}" \
            "https://crm-sfa-integration.vercel.app/api/cron/email-reminder-check"
